name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # By default only main writes the cache, so every run on a PR branch started cold.
          cache-read-only: false
      # The APK is built and linked first so it can be installed sooner; tests and lint run after.
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: podcast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- apk-build-comment -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n📦 **Debug APK** for ${sha}: [download podcast-debug-apk](${process.env.ARTIFACT_URL})\n\n_Requires being signed in to GitHub. The download is a zip containing the APK._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Show lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
